version: 2
updates:
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: weekly
    day: monday
    time: '09:00'
    timezone: Asia/Seoul
  open-pull-requests-limit: 3
  groups:
    npm-minor-patch:
      patterns:
      - "*"
      update-types:
      - minor
      - patch
- package-ecosystem: docker
  directories:
  - "/apps/auth-frontend"
  - "/apps/auth-server"
  - "/apps/remote1"
  - "/apps/remote2"
  - "/apps/shell"
  schedule:
    interval: weekly
    day: monday
    time: '09:00'
    timezone: Asia/Seoul
  open-pull-requests-limit: 2
  groups:
    docker-minor-patch:
      patterns:
      - "*"
      update-types:
      - minor
      - patch
